<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>alen - 元旦晚会特别版</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <link rel="shortcut icon" href="favicon.ico" />
  <style>
    /* 原有样式保持不变 */
    body {
      font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      font-size: calc(10px + 0.33vw);
      -webkit-font-smoothing: antialiased;
      padding: 5vh 10vw;
      color: #ffffff;
      margin: 0;
      background-color: #121314;
      overflow-x: hidden;
    }
    
    h1 {
      font-size: 4.5em;
      font-weight: 500;
      margin-bottom: 0;
    }
    
    p {
      font-size: 1.6em;
      font-weight: 300;
      line-height: 1.4;
      max-width: 26em;
    }
    
    a {
      text-decoration: none;
      color: #ffffff;
      position: relative;
    }
    
    a:after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 60%;
      left: -0.1em;
      right: -0.1em;
      bottom: 0;
      transition: top 200ms cubic-bezier(0, .8, .13, 1);
      background-color: rgba(255,255,255,0.5);
    }
    
    a:hover:after {
      top: 0%;
    }

    #cas {
      position: fixed;
      left:0;
      top:0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }
    
    .control-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(79, 192, 141, 0.8);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1.2em;
      font-weight: bold;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }
    
    .control-btn:hover {
      background: rgba(79, 192, 141, 1);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79, 192, 141, 0.4);
    }
    
    .slide-panel {
      position: fixed;
      top: 0;
      right: -400px;
      width: 380px;
      height: 100vh;
      background: rgba(18, 20, 21, 0.95);
      z-index: 999;
      padding: 20px;
      overflow-y: auto;
      transition: right 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      border-left: 2px solid rgba(79, 192, 141, 0.5);
      backdrop-filter: blur(10px);
      box-shadow: -5px 0 30px rgba(0,0,0,0.5);
    }
    
    .slide-panel.active {
      right: 0;
    }
    
    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: rgba(79, 192, 141, 1);
      font-size: 24px;
      cursor: pointer;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    
    .close-btn:hover {
      background: rgba(79, 192, 141, 0.2);
      transform: rotate(90deg);
    }
    
    .panel-title {
      font-size: 2.5em;
      margin-bottom: 30px;
      color: rgba(79, 192, 141, 1);
      text-align: center;
      position: relative;
      padding-bottom: 10px;
    }
    
    .panel-title:after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(79, 192, 141, 1), transparent);
    }
    
    /* 标签页导航 */
    .tab-nav {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }
    
    .tab-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 1.2em;
      padding: 8px 15px;
      cursor: pointer;
      border-radius: 20px;
      transition: all 0.3s ease;
    }
    
    .tab-btn:hover {
      color: rgba(79, 192, 141, 1);
      background: rgba(79, 192, 141, 0.1);
    }
    
    .tab-btn.active {
      color: rgba(79, 192, 141, 1);
      background: rgba(79, 192, 141, 0.2);
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    /* 倒计时部分 */
    .countdown-section {
      background: rgba(30, 33, 35, 0.8);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 30px;
      border: 1px solid rgba(79, 192, 141, 0.3);
    }
    
    .countdown-title {
      font-size: 1.8em;
      margin-bottom: 15px;
      color: white;
      text-align: center;
    }
    
    .countdown-display {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    
    .countdown-unit {
      text-align: center;
      background: rgba(79, 192, 141, 0.2);
      border-radius: 10px;
      padding: 10px 5px;
      min-width: 70px;
    }
    
    .countdown-value {
      font-size: 2.5em;
      font-weight: bold;
      color: rgba(79, 192, 141, 1);
      display: block;
    }
    
    .countdown-label {
      font-size: 0.9em;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 5px;
    }
    
    .countdown-note {
      text-align: center;
      font-size: 1.1em;
      color: rgba(255, 255, 255, 0.8);
      font-style: italic;
    }
    
    /* 节目单部分 */
    .program-section {
      background: rgba(30, 33, 35, 0.8);
      border-radius: 15px;
      padding: 20px;
      border: 1px solid rgba(79, 192, 141, 0.3);
    }
    
    .program-title {
      font-size: 1.8em;
      margin-bottom: 15px;
      color: white;
      text-align: center;
    }
    
    .program-list {
      list-style-type: none;
      padding: 0;
    }
    
    .program-item {
      padding: 12px 15px;
      margin-bottom: 10px;
      background: rgba(40, 44, 46, 0.8);
      border-radius: 10px;
      border-left: 4px solid rgba(79, 192, 141, 0.5);
      transition: all 0.3s ease;
    }
    
    .program-item:hover {
      background: rgba(50, 54, 56, 0.9);
      transform: translateX(5px);
    }
    
    .program-item.active {
      border-left: 4px solid rgba(79, 192, 141, 1);
      background: rgba(50, 54, 56, 1);
      box-shadow: 0 0 15px rgba(79, 192, 141, 0.3);
    }
    
    .program-time {
      font-weight: bold;
      color: rgba(79, 192, 141, 1);
      margin-bottom: 5px;
    }
    
    .program-name {
      font-size: 1.2em;
      color: white;
    }
    
    .program-performer {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9em;
      margin-top: 5px;
    }
    
    /* 游戏部分样式 */
    .games-section {
      background: rgba(30, 33, 35, 0.8);
      border-radius: 15px;
      padding: 20px;
      border: 1px solid rgba(79, 192, 141, 0.3);
    }
    
    .games-title {
      font-size: 1.8em;
      margin-bottom: 20px;
      color: white;
      text-align: center;
    }
    
    .game-selector {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      gap: 10px;
    }
    
    .game-btn {
      flex: 1;
      background: rgba(40, 44, 46, 0.8);
      border: 2px solid rgba(79, 192, 141, 0.3);
      color: rgba(255, 255, 255, 0.8);
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.1em;
      transition: all 0.3s ease;
    }
    
    .game-btn:hover {
      background: rgba(79, 192, 141, 0.2);
      border-color: rgba(79, 192, 141, 0.7);
      transform: translateY(-3px);
    }
    
    .game-btn.active {
      background: rgba(79, 192, 141, 0.3);
      border-color: rgba(79, 192, 141, 1);
      color: white;
    }
    
    .game-container {
      background: rgba(40, 44, 46, 0.8);
      border-radius: 10px;
      padding: 20px;
      min-height: 300px;
      border: 1px solid rgba(79, 192, 141, 0.2);
    }
    
    /* 猜数字游戏样式 */
    .guess-game {
      text-align: center;
    }
    
    .guess-title {
      font-size: 1.5em;
      margin-bottom: 15px;
      color: rgba(79, 192, 141, 1);
    }
    
    .guess-instruction {
      margin-bottom: 20px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.5;
    }
    
    .guess-input {
      width: 100%;
      padding: 12px;
      font-size: 1.2em;
      background: rgba(30, 33, 35, 0.9);
      border: 2px solid rgba(79, 192, 141, 0.5);
      border-radius: 8px;
      color: white;
      text-align: center;
      margin-bottom: 15px;
    }
    
    .guess-btn {
      background: linear-gradient(135deg, rgba(79, 192, 141, 0.8), rgba(59, 172, 121, 0.8));
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1.1em;
      font-weight: bold;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }
    
    .guess-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(79, 192, 141, 0.4);
    }
    
    .guess-result {
      background: rgba(30, 33, 35, 0.9);
      padding: 15px;
      border-radius: 8px;
      min-height: 80px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .guess-history {
      margin-top: 15px;
      text-align: left;
    }
    
    .history-item {
      padding: 5px 10px;
      margin-bottom: 5px;
      background: rgba(30, 33, 35, 0.7);
      border-radius: 5px;
      border-left: 3px solid rgba(79, 192, 141, 0.5);
    }
    
    /* 反应测试游戏样式 */
    .reaction-game {
      text-align: center;
    }
    
    .reaction-title {
      font-size: 1.5em;
      margin-bottom: 15px;
      color: rgba(79, 192, 141, 1);
    }
    
    .reaction-instruction {
      margin-bottom: 20px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.5;
    }
    
    .reaction-btn {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 87, 87, 0.9), rgba(255, 120, 120, 0.9));
      color: white;
      border: none;
      font-size: 1.5em;
      font-weight: bold;
      cursor: pointer;
      margin: 20px auto;
      transition: all 0.1s ease;
      display: block;
    }
    
    .reaction-btn.active {
      background: linear-gradient(135deg, rgba(79, 192, 141, 0.9), rgba(59, 172, 121, 0.9));
      transform: scale(1.05);
    }
    
    .reaction-stats {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
    }
    
    .stat-item {
      text-align: center;
      background: rgba(30, 33, 35, 0.7);
      padding: 10px 15px;
      border-radius: 8px;
      min-width: 80px;
    }
    
    .stat-value {
      font-size: 1.8em;
      font-weight: bold;
      color: rgba(79, 192, 141, 1);
      display: block;
    }
    
    .stat-label {
      font-size: 0.9em;
      color: rgba(255, 255, 255, 0.7);
    }
    
    /* 打地鼠游戏样式 */
    .whack-game {
      text-align: center;
    }
    
    .whack-title {
      font-size: 1.5em;
      margin-bottom: 15px;
      color: rgba(79, 192, 141, 1);
    }
    
    .whack-instruction {
      margin-bottom: 20px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.5;
    }
    
    .whack-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 10px;
      margin-bottom: 20px;
    }
    
    .whack-hole {
      aspect-ratio: 1;
      background: rgba(60, 40, 20, 0.8);
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    
    .whack-mole {
      position: absolute;
      width: 80%;
      height: 80%;
      background: rgba(140, 90, 60, 0.9);
      border-radius: 50%;
      top: 100%;
      left: 10%;
      transition: top 0.3s ease;
    }
    
    .whack-mole.active {
      top: 10%;
      background: rgba(180, 120, 80, 0.9);
    }
    
    .whack-controls {
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    
    .whack-btn {
      background: linear-gradient(135deg, rgba(79, 192, 141, 0.8), rgba(59, 172, 121, 0.8));
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1em;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    
    .whack-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(79, 192, 141, 0.4);
    }
    
    /* 冒死获取提示 */
    .risk-note {
      text-align: center;
      font-size: 1em;
      color: rgba(255, 100, 100, 0.8);
      margin-top: 20px;
      padding: 10px;
      border: 1px dashed rgba(255, 100, 100, 0.5);
      border-radius: 10px;
      background: rgba(255, 100, 100, 0.1);
    }
    
    /* 响应式调整 */
    @media (max-width: 768px) {
      .slide-panel {
        width: 320px;
        right: -340px;
      }
      
      .countdown-unit {
        min-width: 60px;
      }
      
      .countdown-value {
        font-size: 2em;
      }
      
      .reaction-btn {
        width: 120px;
        height: 120px;
      }
    }
    
    @media (max-width: 480px) {
      .slide-panel {
        width: 280px;
        right: -300px;
      }
      
      .control-btn {
        padding: 10px 15px;
        font-size: 1em;
      }
      
      .tab-btn {
        padding: 6px 10px;
        font-size: 1em;
      }
      
      .game-selector {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <h1>alen</h1>
  <p style="font-weight:500; font-size:2.2em">
    你好，欢迎访问我的网站
  </p>
  <p>
    这是我的b站连接
  </p>
  <a href="http://space.bilibili.com/3546937991105377" target="_blank" class="main">B站空间</a>
  
  <!-- 控制面板按钮 -->
  <button class="control-btn" id="panelToggle">🎉 元旦晚会 🎉</button>
  
  <!-- 滑动面板 -->
  <div class="slide-panel" id="slidePanel">
    <button class="close-btn" id="closePanel">×</button>
    
    <h2 class="panel-title">元旦晚会特别版</h2>
    
    <!-- 标签页导航 -->
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="countdown">倒计时</button>
      <button class="tab-btn" data-tab="program">节目单</button>
      <button class="tab-btn" data-tab="games">小游戏</button>
    </div>
    
    <!-- 倒计时标签页 -->
    <div class="tab-content active" id="countdown-tab">
      <div class="countdown-section">
        <div class="countdown-title">距离元旦晚会开始还有</div>
        <div class="countdown-display">
          <div class="countdown-unit">
            <span class="countdown-value" id="days">00</span>
            <span class="countdown-label">天</span>
          </div>
          <div class="countdown-unit">
            <span class="countdown-value" id="hours">00</span>
            <span class="countdown-label">时</span>
          </div>
          <div class="countdown-unit">
            <span class="countdown-value" id="minutes">00</span>
            <span class="countdown-label">分</span>
          </div>
          <div class="countdown-unit">
            <span class="countdown-value" id="seconds">00</span>
            <span class="countdown-label">秒</span>
          </div>
        </div>
        <div class="countdown-note">准备好迎接狂欢之夜了吗？</div>
      </div>
    </div>
    
    <!-- 节目单标签页 -->
    <div class="tab-content" id="program-tab">
      <div class="program-section">
        <div class="program-title">晚会节目单</div>
        <ul class="program-list" id="programList">
          <!-- 节目将通过JavaScript动态添加 -->
        </ul>
        <div class="risk-note">
          ⚠️ 节目单正在冒死获取中...<br>
          最新情报将随时更新！
        </div>
      </div>
    </div>
    
    <!-- 游戏标签页 -->
    <div class="tab-content" id="games-tab">
      <div class="games-section">
        <div class="games-title">晚会小游戏</div>
        
        <div class="game-selector">
          <button class="game-btn active" data-game="guess">猜数字</button>
          <button class="game-btn" data-game="reaction">反应测试</button>
          <button class="game-btn" data-game="whack">打地鼠</button>
        </div>
        
        <!-- 猜数字游戏 -->
        <div class="game-container guess-game active" id="guess-game">
          <div class="guess-title">猜数字游戏</div>
          <div class="guess-instruction">
            我已经想好了一个1-100之间的数字。<br>
            试试看你能猜几次猜中？
          </div>
          <input type="number" min="1" max="100" class="guess-input" id="guess-input" placeholder="输入1-100之间的数字">
          <button class="guess-btn" id="guess-submit">猜！</button>
          <button class="guess-btn" id="guess-restart" style="background: rgba(255, 87, 87, 0.8);">重新开始</button>
          <div class="guess-result">
            <div id="guess-message">等待你的第一次猜测...</div>
            <div class="guess-history" id="guess-history"></div>
          </div>
        </div>
        
        <!-- 反应测试游戏 -->
        <div class="game-container reaction-game" id="reaction-game">
          <div class="reaction-title">反应速度测试</div>
          <div class="reaction-instruction">
            当按钮变成绿色时，尽快点击它！<br>
            测试你的反应速度有多快。
          </div>
          <button class="reaction-btn" id="reaction-btn">等待...</button>
          <div class="reaction-stats">
            <div class="stat-item">
              <span class="stat-value" id="reaction-time">0</span>
              <span class="stat-label">最快(ms)</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="reaction-average">0</span>
              <span class="stat-label">平均(ms)</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="reaction-count">0</span>
              <span class="stat-label">次数</span>
            </div>
          </div>
          <button class="guess-btn" id="reaction-reset" style="margin-top: 20px;">重置记录</button>
        </div>
        
        <!-- 打地鼠游戏 -->
        <div class="game-container whack-game" id="whack-game">
          <div class="whack-title">打地鼠</div>
          <div class="whack-instruction">
            点击冒出来的地鼠！<br>
            游戏时间：30秒
          </div>
          <div class="whack-stats">
            <div class="stat-item">
              <span class="stat-value" id="whack-score">0</span>
              <span class="stat-label">分数</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="whack-time">30</span>
              <span class="stat-label">时间</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="whack-highscore">0</span>
              <span class="stat-label">最高分</span>
            </div>
          </div>
          <div class="whack-grid" id="whack-grid">
            <!-- 地鼠洞将通过JavaScript动态生成 -->
          </div>
          <div class="whack-controls">
            <button class="whack-btn" id="whack-start">开始游戏</button>
            <button class="whack-btn" id="whack-reset" style="background: rgba(255, 87, 87, 0.8);">重新开始</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 粒子背景画布 -->
  <canvas id="cas"></canvas>

  <script>
    // 粒子背景代码 (保持不变)
    var canvas = document.getElementById("cas");
    var ctx = canvas.getContext("2d");

    resize();
    window.onresize = resize;

    function resize() {
      canvas.width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
      canvas.height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
    }

    var RAF = (function() {
      return window.requestAnimationFrame || window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame || window.oRequestAnimationFrame || window.msRequestAnimationFrame || function(callback) {
            window.setTimeout(callback, 1000 / 60);
          };
    })();

    var warea = {x: null, y: null, max: 20000};
    window.onmousemove = function(e) {
      e = e || window.event;

      warea.x = e.clientX;
      warea.y = e.clientY;
    };
    window.onmouseout = function(e) {
      warea.x = null;
      warea.y = null;
    };

    var dots = [];
    for (var i = 0; i < 1204; i++) {
      var x = Math.random() * canvas.width;
      var y = Math.random() * canvas.height;
      var xa = Math.random() * 2 - 1;
      var ya = Math.random() * 2 - 1;

      dots.push({
        x: x,
        y: y,
        xa: xa,
        ya: ya,
        max: 1204
      });
    }

    setTimeout(function() {
      animate();
    }, 100);

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      var ndots = [warea].concat(dots);

      dots.forEach(function(dot) {
        dot.x += dot.xa;
        dot.y += dot.ya;

        dot.xa *= (dot.x > canvas.width || dot.x < 0) ? -1 : 1;
        dot.ya *= (dot.y > canvas.height || dot.y < 0) ? -1 : 1;

        ctx.fillStyle = 'rgba(79, 192, 141, 0.7)';
        ctx.fillRect(dot.x - 0.5, dot.y - 0.5, 1, 1);

        for (var i = 0; i < ndots.length; i++) {
          var d2 = ndots[i];

          if (dot === d2 || d2.x === null || d2.y === null) continue;

          var xc = dot.x - d2.x;
          var yc = dot.y - d2.y;

          var dis = xc * xc + yc * yc;

          var ratio;

          if (dis < d2.max) {
            if (d2 === warea && dis > (d2.max / 2)) {
              dot.x -= xc * 0.03;
              dot.y -= yc * 0.03;
            }

            ratio = (d2.max - dis) / d2.max;

            ctx.beginPath();
            ctx.lineWidth = ratio / 2;
            ctx.strokeStyle = 'rgba(79,192,141,' + (ratio + 0.2) + ')';
            ctx.moveTo(dot.x, dot.y);
            ctx.lineTo(d2.x, d2.y);
            ctx.stroke();
          }
        }

        ndots.splice(ndots.indexOf(dot), 1);
      });

      RAF(animate);
    }
    
    // 标签页切换功能
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');
    
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const tabId = btn.getAttribute('data-tab');
        
        // 移除所有active类
        tabBtns.forEach(b => b.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));
        
        // 添加active类
        btn.classList.add('active');
        document.getElementById(`${tabId}-tab`).classList.add('active');
      });
    });
    
    // 游戏切换功能
    const gameBtns = document.querySelectorAll('.game-btn');
    const gameContainers = document.querySelectorAll('.game-container');
    
    gameBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const gameId = btn.getAttribute('data-game');
        
        // 移除所有active类
        gameBtns.forEach(b => b.classList.remove('active'));
        gameContainers.forEach(c => c.classList.remove('active'));
        
        // 添加active类
        btn.classList.add('active');
        document.getElementById(`${gameId}-game`).classList.add('active');
      });
    });
    
    // 元旦晚会倒计时功能
    function updateCountdown() {
      const eventDate = new Date('December 31, 2024 19:00:00').getTime();
      const now = new Date().getTime();
      const timeLeft = eventDate - now;
      
      if (timeLeft < 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        return;
      }
      
      const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
      const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
      
      document.getElementById('days').textContent = days.toString().padStart(2, '0');
      document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
      document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
      document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
    }
    
    // 节目单数据
    const programs = [
      { time: "18:30-18:50", name: "暖场视频播放", performer: "技术组" },
      { time: "19:00-19:10", name: "开场舞蹈《青春飞扬》", performer: "舞蹈社" },
      { time: "19:15-19:30", name: "校长新年致辞", performer: "校长" },
      { time: "19:35-19:50", name: "小品《课间十分钟》", performer: "高二(3)班" },
      { time: "19:55-20:15", name: "乐队表演《夜空中最亮的星》", performer: "校园乐队" },
      { time: "20:20-20:40", name: "魔术表演", performer: "神秘嘉宾" },
      { time: "20:45-21:05", name: "歌曲串烧", performer: "校园歌手" },
      { time: "21:10-21:30", name: "互动游戏环节", performer: "主持人" },
      { time: "21:35-22:00", name: "压轴舞蹈《新年快乐》", performer: "全体演员" }
    ];
    
    // 渲染节目单
    function renderProgramList() {
      const programList = document.getElementById('programList');
      programList.innerHTML = '';
      
      programs.forEach((program, index) => {
        const li = document.createElement('li');
        li.className = 'program-item';
        
        const currentHour = new Date().getHours();
        const programHour = parseInt(program.time.split(':')[0]);
        if (Math.abs(currentHour - programHour) <= 1) {
          li.classList.add('active');
        }
        
        li.innerHTML = `
          <div class="program-time">${program.time}</div>
          <div class="program-name">${program.name}</div>
          <div class="program-performer">表演者：${program.performer}</div>
        `;
        
        programList.appendChild(li);
      });
    }
    
    // 面板控制功能
    const panelToggle = document.getElementById('panelToggle');
    const slidePanel = document.getElementById('slidePanel');
    const closePanel = document.getElementById('closePanel');
    
    panelToggle.addEventListener('click', () => {
      slidePanel.classList.add('active');
    });
    
    closePanel.addEventListener('click', () => {
      slidePanel.classList.remove('active');
    });
    
    document.addEventListener('click', (e) => {
      if (!slidePanel.contains(e.target) && e.target !== panelToggle) {
        slidePanel.classList.remove('active');
      }
    });
    
    // 猜数字游戏逻辑
    let targetNumber = Math.floor(Math.random() * 100) + 1;
    let guessCount = 0;
    let guessHistory = [];
    
    document.getElementById('guess-submit').addEventListener('click', makeGuess);
    document.getElementById('guess-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') makeGuess();
    });
    
    document.getElementById('guess-restart').addEventListener('click', () => {
      targetNumber = Math.floor(Math.random() * 100) + 1;
      guessCount = 0;
      guessHistory = [];
      document.getElementById('guess-message').textContent = '新游戏已开始！猜一个1-100之间的数字。';
      document.getElementById('guess-history').innerHTML = '';
      document.getElementById('guess-input').value = '';
      document.getElementById('guess-input').focus();
    });
    
    function makeGuess() {
      const input = document.getElementById('guess-input');
      const guess = parseInt(input.value);
      const message = document.getElementById('guess-message');
      const history = document.getElementById('guess-history');
      
      if (isNaN(guess) || guess < 1 || guess > 100) {
        message.innerHTML = '<span style="color: rgba(255, 100, 100, 0.9);">请输入1-100之间的有效数字！</span>';
        input.value = '';
        input.focus();
        return;
      }
      
      guessCount++;
      guessHistory.push(guess);
      
      let historyHTML = '';
      guessHistory.forEach((g, i) => {
        const diff = Math.abs(g - targetNumber);
        let color = 'rgba(255, 100, 100, 0.9)';
        if (diff <= 5) color = 'rgba(255, 200, 100, 0.9)';
        if (diff <= 2) color = 'rgba(100, 255, 100, 0.9)';
        
        historyHTML += `<div class="history-item" style="border-left-color: ${color};">第${i+1}次: ${g}</div>`;
      });
      
      history.innerHTML = historyHTML;
      
      if (guess === targetNumber) {
        message.innerHTML = `<span style="color: rgba(79, 192, 141, 1); font-weight: bold;">恭喜！你猜对了！数字就是${targetNumber}。<br>你用了${guessCount}次猜中！</span>`;
      } else if (guess < targetNumber) {
        message.innerHTML = `<span style="color: rgba(255, 200, 100, 0.9);">猜小了！试试更大的数字。<br>你已经猜了${guessCount}次。</span>`;
      } else {
        message.innerHTML = `<span style="color: rgba(255, 200, 100, 0.9);">猜大了！试试更小的数字。<br>你已经猜了${guessCount}次。</span>`;
      }
      
      input.value = '';
      input.focus();
    }
    
    // 反应测试游戏逻辑
    let reactionStartTime = 0;
    let reactionTimes = [];
    let reactionWaiting = false;
    let reactionTimeout = null;
    
    const reactionBtn = document.getElementById('reaction-btn');
    const reactionTimeEl = document.getElementById('reaction-time');
    const reactionAverageEl = document.getElementById('reaction-average');
    const reactionCountEl = document.getElementById('reaction-count');
    
    reactionBtn.addEventListener('click', handleReactionClick);
    document.getElementById('reaction-reset').addEventListener('click', resetReactionStats);
    
    function startReactionTest() {
      reactionBtn.textContent = '等待...';
      reactionBtn.classList.remove('active');
      reactionWaiting = true;
      
      // 随机等待时间：1-3秒
      const waitTime = Math.random() * 2000 + 1000;
      
      reactionTimeout = setTimeout(() => {
        reactionBtn.textContent = '点击！';
        reactionBtn.classList.add('active');
        reactionStartTime = Date.now();
        reactionWaiting = false;
      }, waitTime);
    }
    
    function handleReactionClick() {
      if (reactionWaiting) {
        // 点击过早
        clearTimeout(reactionTimeout);
        reactionBtn.textContent = '太快了！重新开始...';
        reactionBtn.classList.remove('active');
        setTimeout(startReactionTest, 1500);
        return;
      }
      
      if (reactionStartTime === 0) {
        // 第一次点击，开始游戏
        startReactionTest();
        return;
      }
      
      const reactionTime = Date.now() - reactionStartTime;
      reactionTimes.push(reactionTime);
      
      updateReactionStats();
      
      // 准备下一次测试
      reactionBtn.textContent = `${reactionTime} ms，继续...`;
      reactionBtn.classList.remove('active');
      reactionStartTime = 0;
      
      setTimeout(startReactionTest, 1000);
    }
    
    function updateReactionStats() {
      const fastest = Math.min(...reactionTimes);
      const average = Math.round(reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length);
      
      reactionTimeEl.textContent = fastest;
      reactionAverageEl.textContent = average;
      reactionCountEl.textContent = reactionTimes.length;
      
      // 保存最高记录到localStorage
      const savedFastest = localStorage.getItem('reactionFastest');
      if (!savedFastest || fastest < savedFastest) {
        localStorage.setItem('reactionFastest', fastest);
      }
    }
    
    function resetReactionStats() {
      reactionTimes = [];
      reactionStartTime = 0;
      reactionBtn.textContent = '等待...';
      reactionBtn.classList.remove('active');
      reactionTimeEl.textContent = '0';
      reactionAverageEl.textContent = '0';
      reactionCountEl.textContent = '0';
      clearTimeout(reactionTimeout);
      
      setTimeout(startReactionTest, 500);
    }
    
    // 打地鼠游戏逻辑
    let whackScore = 0;
    let whackTimeLeft = 30;
    let whackTimer = null;
    let whackGameActive = false;
    let whackMoles = [];
    let whackHighScore = localStorage.getItem('whackHighScore') || 0;
    
    document.getElementById('whack-highscore').textContent = whackHighScore;
    document.getElementById('whack-start').addEventListener('click', startWhackGame);
    document.getElementById('whack-reset').addEventListener('click', resetWhackGame);
    
    // 创建地鼠洞
    const whackGrid = document.getElementById('whack-grid');
    for (let i = 0; i < 9; i++) {
      const hole = document.createElement('div');
      hole.className = 'whack-hole';
      hole.innerHTML = '<div class="whack-mole"></div>';
      hole.addEventListener('click', () => whackMole(i));
      whackGrid.appendChild(hole);
      whackMoles.push({
        element: hole.querySelector('.whack-mole'),
        active: false,
        timer: null
      });
    }
    
    function startWhackGame() {
      if (whackGameActive) return;
      
      whackGameActive = true;
      whackScore = 0;
      whackTimeLeft = 30;
      document.getElementById('whack-score').textContent = whackScore;
      document.getElementById('whack-time').textContent = whackTimeLeft;
      document.getElementById('whack-start').disabled = true;
      
      // 启动计时器
      whackTimer = setInterval(() => {
        whackTimeLeft--;
        document.getElementById('whack-time').textContent = whackTimeLeft;
        
        if (whackTimeLeft <= 0) {
          endWhackGame();
        }
      }, 1000);
      
      // 开始地鼠出现
      startMoleAppearance();
    }
    
    function startMoleAppearance() {
      if (!whackGameActive) return;
      
      // 随机选择一个地鼠出现
      const randomIndex = Math.floor(Math.random() * whackMoles.length);
      showMole(randomIndex);
      
      // 设置下一次地鼠出现的时间（0.5-1.5秒）
      const nextTime = Math.random() * 1000 + 500;
      setTimeout(startMoleAppearance, nextTime);
    }
    
    function showMole(index) {
      if (!whackGameActive || whackMoles[index].active) return;
      
      whackMoles[index].active = true;
      whackMoles[index].element.classList.add('active');
      
      // 地鼠自动消失时间（0.8-1.5秒）
      const hideTime = Math.random() * 700 + 800;
      whackMoles[index].timer = setTimeout(() => {
        hideMole(index);
      }, hideTime);
    }
    
    function hideMole(index) {
      if (!whackMoles[index].active) return;
      
      whackMoles[index].active = false;
      whackMoles[index].element.classList.remove('active');
      clearTimeout(whackMoles[index].timer);
    }
    
    function whackMole(index) {
      if (!whackMoles[index].active || !whackGameActive) return;
      
      // 击中地鼠
      whackScore++;
      document.getElementById('whack-score').textContent = whackScore;
      
      // 隐藏地鼠
      hideMole(index);
      
      // 添加击中效果
      whackMoles[index].element.style.backgroundColor = 'rgba(255, 100, 100, 0.9)';
      setTimeout(() => {
        if (whackMoles[index]) {
          whackMoles[index].element.style.backgroundColor = '';
        }
      }, 200);
    }
    
    function endWhackGame() {
      whackGameActive = false;
      clearInterval(whackTimer);
      document.getElementById('whack-start').disabled = false;
      
      // 隐藏所有地鼠
      whackMoles.forEach((mole, index) => {
        hideMole(index);
      });
      
      // 更新最高分
      if (whackScore > whackHighScore) {
        whackHighScore = whackScore;
        localStorage.setItem('whackHighScore', whackHighScore);
        document.getElementById('whack-highscore').textContent = whackHighScore;
      }
      
      // 显示游戏结束消息
      alert(`游戏结束！\n你的得分：${whackScore}\n最高分：${whackHighScore}`);
    }
    
    function resetWhackGame() {
      endWhackGame();
      whackScore = 0;
      whackTimeLeft = 30;
      document.getElementById('whack-score').textContent = whackScore;
      document.getElementById('whack-time').textContent = whackTimeLeft;
      whackHighScore = localStorage.getItem('whackHighScore') || 0;
      document.getElementById('whack-highscore').textContent = whackHighScore;
    }
    
    // 初始化倒计时和节目单
    updateCountdown();
    renderProgramList();
    
    // 每秒更新一次倒计时
    setInterval(updateCountdown, 1000);
    
    // 每分钟更新一次节目单状态
    setInterval(renderProgramList, 60000);
    
    // 添加键盘快捷键：按ESC关闭面板
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        slidePanel.classList.remove('active');
      }
    });
    
    // 初始化反应测试游戏
    setTimeout(startReactionTest, 2000);
  </script>
</body>
</html>
